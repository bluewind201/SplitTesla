name: Android

on:
  push:
    branches: [main, "feature/**", "claude/**", "bluewind201/**"]
  pull_request:
  workflow_dispatch:

# Pushes close together used to publish latest-apk at the same time, and one
# run's delete raced the other's create. Only the newest run per branch goes on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the publish step can tell whether this commit
          # already contains the one behind the current latest-apk.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core protocol tests
        run: ./gradlew -p core test
      # Release build, signed with the private key when the repo secrets are
      # set (SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD). A release
      # build is not debuggable, so adb can't read the stored car key.
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SPLITTESLA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          # Secrets pasted from secrets.txt may carry the "KEYSTORE_PASSWORD="
          # label, spaces or a line break, so keep only the value.
          pw=$(printf '%s' "$SPLITTESLA_KEYSTORE_PASSWORD" | sed -n 's/^KEYSTORE_PASSWORD=//; /./{p;q}' | tr -d ' \t\r\n')
          export SPLITTESLA_KEYSTORE_PASSWORD="$pw"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            # A wrong secret falls back to the test key instead of failing
            # every branch's build.
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$pw" -alias splittesla >/dev/null 2>&1; then
              export SPLITTESLA_KEYSTORE="$RUNNER_TEMP/release.jks"
              echo "Signing with the release key"
            else
              echo "::warning::Release keystore didn't open (password length ${#pw}); using the test key"
            fi
          else
            echo "::warning::Signing secrets not set; using the test key"
          fi
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTesla-apk
          path: app/build/outputs/apk/release/*.apk
      # Direct .apk download on the "latest-apk" prerelease. Any branch may
      # publish, but only when its commit contains the commit already behind
      # latest-apk. So the link follows whichever branch is on top of the
      # stack, never goes back to an older build (a lower versionCode makes
      # Android refuse to install over the newer app), and a side branch
      # can't replace it. Run the workflow by hand to force a publish.
      - name: Publish APK to latest-apk release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh release view latest-apk --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$current" ] \
             && ! git merge-base --is-ancestor "$current" "$GITHUB_SHA" 2>/dev/null; then
            echo "latest-apk is at ${current::7}, which this branch doesn't contain; not publishing"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk SplitTesla.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SplitTesla.apk --prerelease --target "$GITHUB_SHA" \
            --title "SplitTesla 테스트 APK" \
            --notes "브랜치 ${GITHUB_REF_NAME}, 커밋 ${GITHUB_SHA::7}, 빌드 ${GITHUB_RUN_NUMBER}"
