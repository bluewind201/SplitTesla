name: Android

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
  workflow_dispatch:

# Pushes close together used to publish latest-apk at the same time, and one
# run's delete raced the other's create. Only the newest run per branch goes on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core protocol tests
        run: ./gradlew -p core test
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTesla-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Direct .apk download on the "latest-apk" prerelease. Only the top of the
      # branch stack (design -> logbook -> AI voice) publishes, so the link
      # always has every feature.
      - name: Publish APK to latest-apk release
        if: github.event_name != 'pull_request' && github.ref_name == 'claude/project-thread-ga7jmz'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SplitTesla.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SplitTesla.apk --prerelease --target "$GITHUB_SHA" \
            --title "SplitTesla 테스트 APK" --notes "브랜치 ${GITHUB_REF_NAME}, 커밋 ${GITHUB_SHA::7}"
